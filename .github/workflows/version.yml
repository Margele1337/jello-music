name: Version Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 计算版本号
  check-version:
    if: github.event_name == 'workflow_dispatch'
    name: Check Next Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Get latest tag
        run: |
          echo "Latest tag: $(git tag --sort=-v:refname | head -n 1)"
          
      - name: Calculate next version
        id: set-version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v$(node -p "require('./package.json').version")")
          MAJOR=$(echo $VERSION | awk -F. '{print $1}' | sed 's/v//')
          MINOR=$(echo $VERSION | awk -F. '{print $2}')
          PATCH=$(echo $VERSION | awk -F. '{print $3}')
          PATCH=$((PATCH + 1))
          if [ "$PATCH" -gt 9 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
          fi
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          
      - name: Get previous tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "（仓库暂无 tag，首次发布）")
          echo "Previous version: $PREV_TAG"
          
      - name: Display version information
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "Current version: ${PREV_TAG:-（暂无 tag）}"
          echo "Next version will be: ${{ steps.set-version.outputs.NEW_VERSION }}"
          echo "Changes since last tag:"
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s"
          else
            git log --pretty=format:"* %s" | head -n 50
          fi
        
