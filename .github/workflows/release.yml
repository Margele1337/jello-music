name: Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 创建版本号
  increment-version:
    if: "github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore: release'))"
    name: Increment Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.NEW_VERSION }}
      body: ${{ steps.create-release.outputs.RELEASE_BODY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Increment version
        id: set-version
        run: |
          # 版本规则：package.json 手动 bump 过（与最新 tag 不同）→ 以 package.json 为准；
          # 否则在最新 tag 上自动 patch +1（patch > 9 进位到 minor）
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          VERSION=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$VERSION" ] || [ "$PKG_VERSION" != "$VERSION" ]; then
            NEW_VERSION="$PKG_VERSION"
          else
            MAJOR=$(echo $VERSION | awk -F. '{print $1}' | sed 's/v//')
            MINOR=$(echo $VERSION | awk -F. '{print $2}')
            PATCH=$(echo $VERSION | awk -F. '{print $3}')
            PATCH=$((PATCH + 1))
            if [ "$PATCH" -gt 9 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
            fi
            NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          fi
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create release body
        id: create-release
        run: |
          # 获取上一个tag（首次发布没有 tag）
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"* %s" | head -n 50)
            RELEASE_BODY="## What's Changed\n\n${COMMITS}"
          else
            # 获取最后一个tag到现在的所有commit信息
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s")
            # 如果没有commit信息，使用默认消息
            if [ -z "$COMMITS" ]; then
              COMMITS="* Regular update and bug fixes"
            fi
            # 创建changelog链接
            CHANGELOG_LINK="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${{ steps.set-version.outputs.NEW_VERSION }}"
            # 创建release body
            RELEASE_BODY="## What's Changed\n\n${COMMITS}\n\n**Full Changelog**: [${PREV_TAG}...${{ steps.set-version.outputs.NEW_VERSION }}](${CHANGELOG_LINK})"
          fi
          # 将release body转义后输出
          echo "RELEASE_BODY<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.set-version.outputs.NEW_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Release ${{ steps.set-version.outputs.NEW_VERSION }}"
          body: ${{ steps.create-release.outputs.RELEASE_BODY }}
          prerelease: false
          draft: true # 先创建草稿


  build-and-upload:
    name: Build and Upload
    needs: increment-version
    strategy:
      matrix:
        node: [lts/*]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm' # use cache

      - name: Build
        env:
          os: ${{ runner.os == 'Windows' && 'win' || runner.os == 'macOS' && 'macos' || 'linux' }}
          RELEASE_VERSION: ${{ needs.increment-version.outputs.version }}
        run: |
          npm run install-all
          # 把 tag 版本写进 package.json，保证产物命名/latest.yml/应用内版本与 tag 一致（否则自动更新收不到）
          node -e "const fs=require('fs');const v=process.env.RELEASE_VERSION.replace(/^v/,'');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=v;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('build version =',v)"
          npm run build
          npm run electron:build:${{ env.os }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.increment-version.outputs.version }}
          draft: false # 这里更新下状态
          files: |
            ./dist_electron/*.exe
            ./dist_electron/*.zip
            ./dist_electron/*.dmg
            ./dist_electron/*.AppImage
            ./dist_electron/*.deb
            ./dist_electron/*.blockmap
            ./dist_electron/latest*.yml
