name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # 审批在仓库设置的 Environments → release 里配置 required reviewer；
    # tag 保护规则（Settings → Rules → Rulesets）限制 v* 的删除与强推。
    environment: release
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix api install --omit=dev
      - run: npm test
      - run: npm run build
      - name: Cache electron-builder resources
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-x64-v1
      - name: Package and upload release assets
        timeout-minutes: 25
        env:
          DEBUG: electron-builder,electron-builder:nsis
          # electron-builder 对 7z 载荷硬编码 -mx=9（compression 配置只影响
          # zip），单线程压 382MB 在 2 核 runner 上超 25 分钟；官方逃生门：
          # 该环境变量直接覆盖压缩等级。5 级实测 1 分钟、包仅大 2MB
          ELECTRON_BUILDER_COMPRESSION_LEVEL: 5
        run: npx electron-builder --win --x64 --publish always
