version: '3.3'

services:
  jello-music:
    container_name: jello-music # 容器名
    restart: unless-stopped # 自动重启
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      - PORT=6521
      - platform=lite
    ports: # 端口映射
      - "8080:8080"  # 前端服务（API 由 nginx 反代 /api/ → 容器内 6521，不直接对外，
                     # 避免部署到公网时成为开放的音乐 API 代理）
