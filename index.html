<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CSP 是占位内容：vite.config.js 的 cspPlugin 会在 dev/build 两个阶段用
       shared/csp.js 的 buildCsp 重写（媒体/跨源全部走 jello-media 自定义协议）。 -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src blob: jello-media:; connect-src 'self' jello-media:"
  />
  <title>Jello Music</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
