<!-- public/index.html -->
<!DOCTYPE html>
<html lang="zh" style="background: transparent;">

<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Jello Music</title>
    <meta name="theme-color" content="#E18FA8">
    <meta name="description" content="Jello Music,一个高颜值的酷狗第三方播放器">
    <meta name="author" content="Margele1337">
    <meta name="url" content="https://github.com/Margele1337/jello-music">
    <meta name="keywords" content="Jello Music,酷狗,第三方播放器,音乐播放器">
    <link href="/assets/font-awesome/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
        // 尽早设置 <html lang>（字体回退/屏幕阅读器用）；支持语言与 src/utils/i18n.js 保持一致
        (() => {
            const SUPPORTED_LOCALES = ['zh-CN', 'zh-TW', 'en', 'ru', 'ja', 'ko'];
            const getBrowserLocale = () => {
                const browserLang = navigator.language || 'zh-CN';
                if (browserLang.startsWith('zh')) {
                    return (browserLang === 'zh-TW' || browserLang === 'zh-HK') ? 'zh-TW' : 'zh-CN';
                }
                const lang = browserLang.split('-')[0];
                return SUPPORTED_LOCALES.includes(lang) ? lang : 'ja';
            };
            let savedLanguage = '';
            try {
                savedLanguage = JSON.parse(localStorage.getItem('settings') || '{}')?.language || '';
            } catch (error) {
                savedLanguage = '';
            }
            document.documentElement.lang = savedLanguage || getBrowserLocale();
        })();
    </script>
</body>

</html>
