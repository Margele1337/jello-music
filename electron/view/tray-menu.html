<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: blob: https: http://*.kugou.com https://*.kugou.com; font-src 'self' file: data:; connect-src 'none'" />
    <title>Jello Music Tray Menu</title>
    <style>
        /* 深色单主题：与 Sigma 面板/登录页同一设计语言（深底 + 粉色点缀） */
        :root {
            color-scheme: dark;
            --card-bg: rgba(16, 17, 20, 0.97);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ece9f1;
            --text-secondary: rgba(236, 233, 241, 0.55);
            --text-muted: rgba(236, 233, 241, 0.35);
            --track-bg: rgba(255, 255, 255, 0.12);
            --btn-bg: rgba(255, 255, 255, 0.07);
            --btn-bg-hover: rgba(255, 255, 255, 0.14);
            --accent: #FF69B4;
            --accent-soft: rgba(255, 105, 180, 0.14);
            --accent-glow: rgba(255, 105, 180, 0.35);
            --danger: #ff7b7b;
            --danger-soft: rgba(255, 123, 123, 0.12);
            --divider: rgba(255, 255, 255, 0.07);
            --shadow: 0 20px 48px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        }

        button {
            border: 0;
            margin: 0;
            padding: 0;
            font: inherit;
            color: inherit;
            background: none;
            cursor: pointer;
        }

        .menu-card {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 14px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        /* ===== 歌曲区 ===== */
        .song-section {
            padding: 11px 11px 7px;
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
        }

        .cover {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            overflow: hidden;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .song-meta {
            min-width: 0;
            overflow: hidden;
        }

        .song-title {
            display: block;
            max-width: 100%;
            margin: 0;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            word-break: keep-all;
        }

        .song-artist {
            display: block;
            max-width: 100%;
            margin-top: 2px;
            font-size: 11px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            word-break: keep-all;
        }

        .progress-track {
            margin-top: 6px;
            height: 4px;
            border-radius: 999px;
            background: var(--track-bg);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: var(--accent);
            transition: width 0.18s ease;
        }

        .progress-time {
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
        }

        /* ===== 播放控制 ===== */
        .control-row {
            padding: 2px 11px 9px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .control-btn {
            height: 36px;
            border-radius: 10px;
            background: var(--btn-bg);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, transform 0.15s ease;
        }

        .control-btn:hover {
            background: var(--btn-bg-hover);
            transform: translateY(-1px);
        }

        .control-btn.primary {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 6px 18px var(--accent-glow);
        }

        .control-btn.primary:hover {
            filter: brightness(1.06);
        }

        .divider {
            height: 1px;
            margin: 0 11px;
            background: var(--divider);
            flex-shrink: 0;
        }

        /* ===== 动作列表 ===== */
        .action-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px 6px 6px;
        }

        .action-list::-webkit-scrollbar {
            display: none;
        }

        .action-item {
            width: 100%;
            height: 34px;
            border-radius: 9px;
            padding: 0 7px;
            display: grid;
            grid-template-columns: 24px minmax(0, 1fr);
            gap: 9px;
            align-items: center;
            transition: background-color 0.14s ease;
            text-align: left;
        }

        .action-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .action-item.danger {
            color: var(--danger);
        }

        .action-item.danger .action-icon {
            background: var(--danger-soft);
            color: var(--danger);
        }

        .action-item.danger:hover {
            background: var(--danger-soft);
        }

        .action-icon {
            width: 24px;
            height: 24px;
            border-radius: 7px;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-label {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn .icon {
            width: 17px;
            height: 17px;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="menu-card">
        <section class="song-section">
            <div class="cover" id="cover"></div>
            <div class="song-meta">
                <h1 class="song-title" id="songTitle">Jello Music</h1>
                <div class="song-artist" id="songArtist">-</div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-time">
                    <span id="currentTime">00:00</span>
                    <span id="durationTime">00:00</span>
                </div>
            </div>
        </section>

        <section class="control-row">
            <button class="control-btn" type="button" data-action="prev-track" id="prevControl"></button>
            <button class="control-btn primary" type="button" data-action="toggle-play-pause" id="playControl"></button>
            <button class="control-btn" type="button" data-action="next-track" id="nextControl"></button>
        </section>

        <div class="divider"></div>

        <div class="action-list" id="actionList"></div>
    </div>

    <script src="./tray-menu.js"></script>
</body>
</html>
